[package]
name = "xenon"
version = "0.0.35"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A Rust N-dimensional array library for scientific computing"
keywords = ["tensor", "array", "numpy", "scientific", "ndarray"]
categories = ["science", "mathematics", "data-structures"]

[features]

# Parallel computing (depends on rayon)
parallel = ["dep:rayon"]

# SIMD acceleration (depends on pulp)
simd = ["dep:pulp"]

[dependencies]
rayon = { version = "1.12", optional = true }
pulp = { version = "0.22", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
proptest = "1"
static_assertions = "1"

[[bench]]
name = "math"
harness = false

[[bench]]
name = "reduction"
harness = false

[[bench]]
name = "dot"
harness = false

[[bench]]
name = "set"
harness = false

[[bench]]
name = "broadcast"
harness = false

[[bench]]
name = "shape"
harness = false

[[bench]]
name = "simd"
harness = false

[[bench]]
name = "parallel"
harness = false

[[bench]]
name = "construction"
harness = false
