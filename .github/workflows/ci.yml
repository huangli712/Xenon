# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Format check ──────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── Clippy lint matrix across feature combos ─────────────────
  # Covers all feature combinations so cfg-gated code paths inside
  # `simd`/`parallel` modules are also lint-checked.
  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-features
            args: ""
          - name: simd
            args: "--features simd"
          - name: parallel
            args: "--features parallel"
          - name: all-features
            args: "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: >
          cargo clippy --all-targets ${{ matrix.args }} --
          -D warnings
          -D clippy::cast_possible_truncation
          -D clippy::cast_possible_wrap
          -D clippy::cast_sign_loss
          -D clippy::cast_precision_loss
          -D clippy::cast_lossless

  # ── MSRV check (Rust 1.95) ──────────────────────────────────
  # Ensures the crate compiles on the declared MSRV; uses --all-features
  # to cover cfg-gated code paths. RUSTFLAGS=-D warnings is intentionally
  # NOT inherited here because new rustc versions may introduce warnings
  # that did not exist when the MSRV was pinned.
  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo check --all-features --all-targets

  # ── Test matrix across feature combos ─────────────────────────
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-features
            args: ""
          - name: simd
            args: "--features simd"
          - name: parallel
            args: "--features parallel"
          - name: simd-parallel
            args: "--features simd,parallel"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run lib + integration tests
        run: cargo test --lib --tests ${{ matrix.args }} -- --nocapture
      - name: Run doc tests
        run: cargo test --doc ${{ matrix.args }}
      - name: Run property tests
        run: cargo test --test property_tests ${{ matrix.args }}

  # ── Compile-fail harness ──────────────────────────────────────
  compile-fail:
    name: Compile-fail harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --test compile_fail_tests

  # ── Source audit: std-only environment declarations ──────────
  # Grep-level check that src/lib.rs, README.md, and examples/ contain
  # no out-of-scope platform declarations (no_std, wasm, embedded, etc.)
  # and that the std-only declaration is present in src/lib.rs.
  audit:
    name: Source audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: std env audit
        run: |
          set -euo pipefail
          [ -f src/lib.rs ] || { echo 'Missing src/lib.rs'; exit 1; }
          [ -f README.md ] || { echo 'Missing README.md'; exit 1; }
          [ -d examples/ ] || { echo 'Missing examples/'; exit 1; }
          if grep -rnPE 'no_std|nostd|\balloc(-only)?\b|wasm|webassembly|embedded|bare[-_. ]metal|freestanding' \
                  src/lib.rs README.md examples/ ; then
              echo '✗ Out-of-scope platform declarations remain'
              exit 1
          fi
          grep -q 'Xenon supports only the .std. environment' src/lib.rs \
              || { echo 'Missing std-only declaration in src/lib.rs'; exit 1; }
          echo 'OK: std env audit gate passed'

  # ── Documentation build smoke check ──────────────────────────
  docs:
    name: Docs (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"
