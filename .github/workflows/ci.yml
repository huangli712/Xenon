# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs on the same PR branch when a new commit lands.
# Pushes to main are NOT cancelled to preserve historical integrity.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Restrict the workflow token to read-only repository contents.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Format check ──────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt
      # No rust-cache: cargo fmt doesn't compile.
      - run: cargo fmt --all -- --check

  # ── Clippy lint matrix across feature combos ─────────────────
  # Covers all feature combinations so cfg-gated code paths inside
  # `simd`/`parallel` modules are also lint-checked.
  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-features
            args: ""
          - name: simd
            args: "--features simd"
          - name: parallel
            args: "--features parallel"
          - name: all-features
            args: "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: >
          cargo clippy --all-targets ${{ matrix.args }} --
          -D warnings
          -D clippy::cast_possible_truncation
          -D clippy::cast_possible_wrap
          -D clippy::cast_sign_loss
          -D clippy::cast_precision_loss
          -D clippy::cast_lossless

  # ── Test matrix across feature combos ─────────────────────────
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-features
            args: ""
          - name: simd
            args: "--features simd"
          - name: parallel
            args: "--features parallel"
          - name: all-features
            args: "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      # `--tests` covers all integration test targets in tests/,
      # including property_tests.rs and tests/property/.
      - name: Run lib + integration tests
        run: cargo test --lib --tests ${{ matrix.args }} -- --nocapture
      - name: Run doc tests
        run: cargo test --doc ${{ matrix.args }}

  # ── Compile-fail harness ──────────────────────────────────────
  compile-fail:
    name: Compile-fail harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test compile_fail_tests

  # ── Source audit: std-only environment declarations ──────────
  # Grep-level check that src/lib.rs, README.md, and examples/ contain
  # no out-of-scope platform declarations (no_std, wasm, embedded, etc.)
  # and that the std-only declaration is present in src/lib.rs.
  audit:
    name: Source audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: std env audit
        run: |
          set -euo pipefail
          [ -f src/lib.rs ] || { echo 'Missing src/lib.rs'; exit 1; }
          [ -f README.md ] || { echo 'Missing README.md'; exit 1; }
          [ -d examples/ ] || { echo 'Missing examples/'; exit 1; }
          if grep -rnPE 'no_std|nostd|\balloc(-only)?\b|wasm|webassembly|embedded|bare[-_. ]metal|freestanding' \
                  src/lib.rs README.md examples/ ; then
              echo '✗ Out-of-scope platform declarations remain'
              exit 1
          fi
          grep -q 'Xenon supports only the .std. environment' src/lib.rs \
              || { echo 'Missing std-only declaration in src/lib.rs'; exit 1; }
          echo 'OK: std env audit gate passed'

  # ── Documentation build smoke check ──────────────────────────
  docs:
    name: Docs (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ── Examples build + run ──────────────────────────────────────
  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Build examples (all features)
        run: cargo build --examples --all-features
      - name: Run key examples (default features)
        run: |
          cargo run --example basic
          cargo run --example broadcasting
          cargo run --example workspace
          cargo run --example complex
          cargo run --example ffi
      - name: Run feature-gated examples
        run: |
          cargo run --example features --features parallel,simd
          cargo run --example simd --features simd

  # ── Sealed-trait doc grep ─────────────────────────────────────
  # Verifies every whitelisted public sealed trait has a `# Sealed`
  # doc section in its docblock.
  sealed-trait-doc:
    name: Sealed-trait doc grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sealed-trait doc grep
        run: |
          set -euo pipefail
          # Whitelist: public sealed traits requiring a `# Sealed` doc section
          WHITELIST=(
            "Dimension" "Reverse"
            "Element" "Numeric" "RealScalar" "ComplexScalar" "CastElement"
            "RawStorage" "RawStorageMut" "Storage" "StorageMut" "StorageOwned" "StorageShared"
            "IsOwned" "IsView" "IsViewMut" "IsShared"
            "CastTo"
          )
          fail=0
          for name in "${WHITELIST[@]}"; do
            loc=$(grep -rn "pub trait ${name}\b" src/ || true)
            if [ -z "$loc" ]; then
              echo "::warning::Sealed trait ${name} not found (may be feature-gated)."
              continue
            fi
            file=$(echo "$loc" | head -1 | cut -d: -f1)
            line=$(echo "$loc" | head -1 | cut -d: -f2)
            start=$((line - 30))
            [ $start -lt 1 ] && start=1
            block=$(sed -n "${start},${line}p" "$file" | grep -B0 -E '^///' || true)
            if ! echo "$block" | grep -q "# Sealed"; then
              echo "::error file=$file,line=$line::Sealed trait ${name} missing '# Sealed' doc section"
              fail=1
            fi
          done
          [ $fail -eq 0 ]
