name: Benchmarks
on:
  workflow_dispatch:
    inputs:
      level:
        description: 'Benchmark level'
        required: true
        type: choice
        options: [smoke, regression, full]
        default: smoke
  pull_request:
    paths:
      - 'benches/**'
      - 'src/**/*.rs'
      - 'Cargo.toml'

# Cancel previous runs on the same PR branch when a new commit lands.
# Pushes to main are NOT cancelled to preserve historical integrity.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bench-smoke:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.level == 'smoke')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      # Smoke test: math.rs / reduction.rs / construction.rs
      - name: Quick smoke — core benches
        run: |
          cargo bench --bench math -- "elem_add_f64" --quick
          cargo bench --bench reduction -- "sum_1d_f64" --quick
          cargo bench --bench construction -- "zeros_1d" --quick
      - name: Quick smoke — comparison benches (feature matrix)
        run: |
          # SIMD comparison: run twice for A-B compare (feature-off vs feature-on)
          cargo bench --bench simd -- "simd_add_compare" --quick
          cargo bench --bench simd --features simd -- "simd_add_compare" --quick
          # Parallel comparison: same A-B pattern
          cargo bench --bench parallel -- "par_add_compare" --quick
          cargo bench --bench parallel --features parallel -- "par_add_compare" --quick

  bench-regression:
    if: inputs.level == 'regression'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache both the main crate and the bench-report tool crate.
          workspaces: |
            .
            tools/report
      # Baseline consumption: elem_add_f64 + sum_1d_f64 (Medium = 65536)
      - name: Run regression benches and capture output
        run: |
          mkdir -p target
          cargo bench --bench math -- "elem_add_f64" > target/bench-smoke.txt
          cargo bench --bench reduction -- "sum_1d_f64" >> target/bench-smoke.txt
      - name: Build bench-report
        run: cargo build --release --manifest-path tools/report/Cargo.toml
      - name: Report regression analysis
        run: tools/report/target/release/bench-report --input target/bench-smoke.txt --baseline tools/bench/baseline.json

  bench-full:
    if: inputs.level == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full benchmark = all files × 4 feature combinations
        # (default / simd / parallel / simd+parallel)
        # `name` doubles as the rust-cache key and the displayed job name.
        include:
          # math × 4
          - { bench: math,         features: "",                         name: math-default }
          - { bench: math,         features: "--features simd",          name: math-simd }
          - { bench: math,         features: "--features parallel",      name: math-parallel }
          - { bench: math,         features: "--features simd,parallel", name: math-all }
          # reduction × 4
          - { bench: reduction,    features: "",                         name: reduction-default }
          - { bench: reduction,    features: "--features simd",          name: reduction-simd }
          - { bench: reduction,    features: "--features parallel",      name: reduction-parallel }
          - { bench: reduction,    features: "--features simd,parallel", name: reduction-all }
          # dot × 4
          - { bench: dot,          features: "",                         name: dot-default }
          - { bench: dot,          features: "--features simd",          name: dot-simd }
          - { bench: dot,          features: "--features parallel",      name: dot-parallel }
          - { bench: dot,          features: "--features simd,parallel", name: dot-all }
          # set × 4
          - { bench: set,          features: "",                         name: set-default }
          - { bench: set,          features: "--features simd",          name: set-simd }
          - { bench: set,          features: "--features parallel",      name: set-parallel }
          - { bench: set,          features: "--features simd,parallel", name: set-all }
          # broadcast × 4
          - { bench: broadcast,    features: "",                         name: broadcast-default }
          - { bench: broadcast,    features: "--features simd",          name: broadcast-simd }
          - { bench: broadcast,    features: "--features parallel",      name: broadcast-parallel }
          - { bench: broadcast,    features: "--features simd,parallel", name: broadcast-all }
          # shape × 4
          - { bench: shape,        features: "",                         name: shape-default }
          - { bench: shape,        features: "--features simd",          name: shape-simd }
          - { bench: shape,        features: "--features parallel",      name: shape-parallel }
          - { bench: shape,        features: "--features simd,parallel", name: shape-all }
          # construction × 4
          - { bench: construction, features: "",                         name: construction-default }
          - { bench: construction, features: "--features simd",          name: construction-simd }
          - { bench: construction, features: "--features parallel",      name: construction-parallel }
          - { bench: construction, features: "--features simd,parallel", name: construction-all }
          # simd × 2 (only `simd` feature toggle matters for this comparison bench)
          - { bench: simd,         features: "",                         name: simd-off }
          - { bench: simd,         features: "--features simd",          name: simd-on }
          # parallel × 2 (only `parallel` feature toggle matters for this comparison bench)
          - { bench: parallel,     features: "",                         name: parallel-off }
          - { bench: parallel,     features: "--features parallel",      name: parallel-on }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Run ${{ matrix.name }}
        run: cargo bench --bench ${{ matrix.bench }} ${{ matrix.features }}